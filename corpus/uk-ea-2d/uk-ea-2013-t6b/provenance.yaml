modifications: Deterministic bilinear DEM sampling onto nominal Cartesian quads; SI
  forcing. Raster cells with sampled height >= 1 m excluded as impermeable walls/building;
  retained flume bed set to 0 m. Nominal Cartesian stair-step barrier representation;
  must assess geometry sensitivity before measured validation. Original measured time
  series not supplied; numerical diagnostics only.

original_units: SI
modifications: Deterministic bilinear DEM sampling onto nominal Cartesian quads; SI
  forcing. Active cells selected by centre inside supplied polygon; boundary is a
  nominal 50 m Cartesian staircase. Inlet is mapped to exposed staircase edges near
  source line; total discharge normalized by selected edge length. 1 boundary cells
  excluded because their corners intersect source NODATA. Polygon area, inlet geometry
  and refinement sensitivity remain to be qualified.

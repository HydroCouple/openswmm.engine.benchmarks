modifications: GUI constrained Delaunay triangulation of specification geometry; SI
  depths. GUI constrained Delaunay triangles follow the dimensioned flume, dam abutments,
  1 m opening and 0.8 by 0.4 m building rotated 64 degrees (all lengths scaled by
  20 for 6B). Figure (a) defines exact straight wall geometry and 0.34 m wide / 0.155
  m high side-bank slopes; pixelated DEM barrier transitions are not fitted. This
  is a drawing-based geometric reconstruction, not a vertexwise reproduction of the
  supplied DEM. Bank toes and X=0 depth discontinuity are internal mesh constraints,
  not walls. All exposed edges are explicit reflective WALL boundaries. Initial conditions
  are uniform water depths, as specified, including over the bank slopes; no fitted
  time shift or roughness calibration. Original measured series missing; recovered
  isolated UCL markers provide exploratory 6A comparison only.

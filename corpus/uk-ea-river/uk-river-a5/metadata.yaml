notes: Dedicated uk_river suite; never engine-to-engine parity. A transient SWMM2D
  march initialized from the analytical profile reproduces the source quasi-steady
  duration; no independent direct steady solver is claimed. SWMM2D applies bed Manning
  friction using depth; the source 1D solution includes finite-width hydraulic radius.
  Sidewall shear is not added or calibrated. The 1 m source spacing is retained along
  the flow; two 5 m-wide cells span the uniform 10 m section. Source cross sections/analytical
  levels are tabulated at 1 m. Linear interpolation onto cell centres is disclosed,
  especially across hydraulic jumps.

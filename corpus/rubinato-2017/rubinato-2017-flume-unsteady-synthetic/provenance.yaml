modifications: >
  Synthetic ramp/plateau hydrograph, not an observed event or validation against Figure 11. Table 1 constrains only the peak ratio and duration. The decks set HEAD_TOLERANCE 0.00001 and the WEIR_ORIFICE law's regularization head H_EPS=0.0033333 (0.02/6 m, the rig scale), as the engine's Rubinato test decks do.

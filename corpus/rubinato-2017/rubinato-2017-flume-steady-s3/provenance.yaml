modifications: >
  Reconstructed inflows and outfall stage, 0.2 m mesh, central manhole assumed. Absolute fit is report-only; inspect mass balance and steady-state drift separately. Map-row CD/AREA omitted. Current reconstruction is not experimentally qualified.

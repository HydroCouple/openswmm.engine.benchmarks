# Static dashboard deployment. Artifact-based Pages deploy (no gh-pages branch
# bloat); perf history lives on a separate benchmark-data branch that the site
# build ingests.
name: Publish

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results/
          merge-multiple: true
        continue-on-error: true

      # Renders the scoreboard, immutable per-run pages keyed by engine SHA,
      # per-tag facets over the corpus, and the shields.io badge endpoints.
      # Self-contained HTML: no external hosts, so it survives a CDN outage.
      - name: Build site
        run: python -m harness.report results/ --site site/build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

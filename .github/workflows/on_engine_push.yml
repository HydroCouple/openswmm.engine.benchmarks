# repository_dispatch receiver: openswmm.engine fires this after a gated push
# to develop/main, carrying the engine SHA. This repo builds that SHA, runs the
# fuller tier, and publishes to its own Pages — which is why the engine repo
# needs only dispatch permission and never a Pages credential here.
name: Engine push

permissions:
  contents: read

on:
  repository_dispatch:
    types: [engine-push]

env:
  OMP_NUM_THREADS: 1

jobs:
  sweep:
    name: Sweep ${{ github.event.client_payload.ref }}@${{ github.event.client_payload.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # A blank sha would make the build step check out the engine's DEFAULT
      # branch and publish results keyed to a commit that never produced them.
      - name: Require an engine SHA in the payload
        env:
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ -z "$SHA" ]; then
            echo "::error::dispatch carried no client_payload.sha - refusing to sweep an unidentified engine"
            exit 1
          fi
          echo "engine $SHA from ${{ github.event.client_payload.repo }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # Build the exact SHA the engine repo dispatched, so the published
      # results are keyed to that commit rather than to whatever `develop`
      # happens to be when this job starts.
      - name: Build dispatched engine
        uses: ./.github/actions/build-engine
        with:
          ref: ${{ github.event.client_payload.sha }}

      # The tier is explicit. `parity` defaults to `pr`, and no case has opted
      # into that tier yet (curating it needs measured runtimes), so the default
      # would sweep ZERO models — and an empty sweep is now an ERROR rather than
      # a silent green. `nightly` is the whole corpus; a dispatcher that wants
      # something cheaper can send `client_payload.tier` once `pr` is curated.
      # --max-wall 300: see nightly.yml. Long models run locally, not on a
      # shared runner; the skips are announced, never silent.
      - name: Run suites
        id: sweep
        run: |
          python run_regression.py --suite all \
            --tier "${{ github.event.client_payload.tier || 'nightly' }}" \
            --max-wall 300 \
            --summary "$GITHUB_STEP_SUMMARY" --badges badges/
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-engine-${{ github.event.client_payload.sha }}
          path: |
            results/
            badges/
          retention-days: 14

      # continue-on-error on the sweep exists ONLY so the artifacts upload and
      # the dashboard publishes when a sweep fails. Without this step the job
      # then concludes SUCCESS, so the engine author sees green while the
      # parity gate is failing — a regression platform whose gate does not gate.
      - name: Gate on the sweep result
        if: steps.sweep.outcome == 'failure'
        run: |
          echo "::error::the sweep reported failures for engine ${{ github.event.client_payload.sha }}"
          exit 1

  publish:
    needs: sweep
    # See F20: a skipped publish leaves the previous dashboard up, which makes
    # a failed run look like a passing one.
    if: always()
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      # A reusable workflow cannot request more than its caller grants, and
      # publish.yml needs actions:read to fetch the sweep's artifacts when it
      # is dispatched on its own. Omitting it here makes the whole workflow
      # file invalid, not just that one step.
      actions: read
      pages: write
      id-token: write

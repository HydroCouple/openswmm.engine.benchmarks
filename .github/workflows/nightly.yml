# Full sweep across the whole corpus and every registered engine, publishing
# reports, badges, and performance trends.
name: Nightly

permissions:
  contents: read

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: CI tier to run
        default: nightly
        type: choice
        options: [pr, nightly, weekly]
      engines:
        description: Comma-separated engine ids (blank = all registered)
        required: false
      engine_ref:
        description: openswmm.engine ref to build
        default: swmm6_rel
        required: false
      description:
        description: What this run is for (shown on the dashboard; blank = generated)
        required: false

env:
  OMP_NUM_THREADS: 1
  # Without this the runner's pipe block-buffers stdout, and a job canceled
  # at its time limit loses every "=== suite:" line it printed.
  PYTHONUNBUFFERED: "1"

jobs:
  sweep:
    name: Sweep (${{ matrix.platform.alias }}, ${{ matrix.part.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {os: ubuntu-latest, alias: Linux-x64}
          - {os: windows-latest, alias: Windows-x64}
        # One parity sweep took longer than a job may run: on 2026-11-21 the
        # Linux job reached 889 of 1,402 cases in 5.3 h and was canceled, every
        # night since October. Parity is split across four jobs, each with its
        # own time limit; every other suite runs once in a fifth.
        # --ci-resolution: the SWASHES McDonald cases cost 5-70 min per solver
        # at 1 m, and SWASHES alone ran out the job's time on 2026-11-22. Here
        # they run coarse as a regression check; the 1 m analytic verdict runs
        # in swashes_weekly.yml.
        part:
          - {name: parity-1of4, args: --suite parity --shard 1/4}
          - {name: parity-2of4, args: --suite parity --shard 2/4}
          - {name: parity-3of4, args: --suite parity --shard 3/4}
          - {name: parity-4of4, args: --suite parity --shard 4/4}
          - {name: other-suites, args: --suite all --exclude parity --ci-resolution}
    runs-on: ${{ matrix.platform.os }}
    # A full-corpus sweep can outrun the 6h default, and a
    # canceled job reads as infrastructure noise rather than a result.
    # Bound it explicitly so overrun is a visible, deliberate limit.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # git-ref engines (swmm-5.2.4) resolve from OPENSWMM_BENCH_CACHE when a
      # cached artifact exists and degrade to UNAVAILABLE otherwise — they are
      # never gating, so a missing cache cannot fail this job.
      - name: Build engines
        uses: ./.github/actions/build-engine
        with:
          ref: ${{ inputs.engine_ref || 'swmm6_rel' }}

      # --max-wall 300: cases MEASURED to cost more than five minutes are a
      # local concern. On a shared runner they are skipped, loudly — a
      # ::warning:: per case and a SKIP cell in the envelope, so the dashboard
      # shows a deliberate exclusion rather than a missing result. Cases that
      # carry a ci_runtime trim run here on a shortened period instead. The
      # measurements live in harness/runtimes.yaml; anything unmeasured runs
      # normally, bounded by the manifest's timeout_s.
      # The BENCH_* variables identify this job in the run manifest
      # (results/run.json) the dashboard shows with every result: its name,
      # its job log, the matrix part and platform, and the dispatch form's
      # description.
      - name: Run suites
        id: sweep
        env:
          BENCH_JOB_NAME: Sweep (${{ matrix.platform.alias }}, ${{ matrix.part.name }})
          BENCH_JOB_ID: ${{ job.check_run_id }}
          BENCH_PART: ${{ matrix.part.name }}
          BENCH_PLATFORM_ALIAS: ${{ matrix.platform.alias }}
          BENCH_RUN_DESCRIPTION: ${{ inputs.description }}
        run: |
          python run_regression.py ${{ matrix.part.args }} \
            --tier ${{ inputs.tier || 'nightly' }} \
            --max-wall 300 \
            --summary "$GITHUB_STEP_SUMMARY" \
            --badges badges/
        shell: bash
        continue-on-error: true

      # The evidence: every retained run tree, the envelopes and the manifest.
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: results-${{ matrix.platform.alias }}-${{ matrix.part.name }}
          path: |
            results/
            badges/
          retention-days: 30

      - name: Link the evidence from the run manifest
        if: always()
        shell: bash
        env:
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: python -m harness.runinfo --set-artifact evidence "$EVIDENCE_URL"

      # What the dashboard reads: the manifest, every envelope (SWASHES and
      # transitions keep theirs in their suite folders) and the badges. About
      # a megabyte, where the evidence above runs to a gigabyte a job.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scores-${{ matrix.platform.alias }}-${{ matrix.part.name }}
          path: |
            results/run.json
            results/**/*scores*.json
            suites/analytical/*/*_scores.json
            badges/
          retention-days: 90
          if-no-files-found: warn

      # continue-on-error above exists ONLY so the artifacts upload and the
      # dashboard publishes when a sweep fails. Without this step the job then
      # concludes SUCCESS, so the workflow badge is green while the parity gate
      # is failing — a regression platform whose gate does not gate.
      - name: Gate on the sweep result
        if: steps.sweep.outcome == 'failure'
        run: |
          echo "::error::the sweep reported failures; see the job summary and the published dashboard"
          exit 1

  publish:
    name: Publish dashboard
    needs: sweep
    # always(): a sweep that failed is exactly when the dashboard must be
    # refreshed. Skipping publish leaves the PREVIOUS run's page standing, so a
    # broken nightly is indistinguishable from a healthy one (see F20).
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/publish.yml
    with:
      run_id: ${{ github.run_id }}
    permissions:
      # write: publish appends this run to the benchmark-data branch
      contents: write
      # A reusable workflow cannot request more than its caller grants, and
      # publish.yml needs actions:read to fetch the sweep's artifacts when it
      # is dispatched on its own. Omitting it here makes the whole workflow
      # file invalid, not just that one step.
      actions: read
      pages: write
      id-token: write

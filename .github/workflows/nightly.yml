# Full sweep across the whole corpus and every registered engine, publishing
# reports, badges, and performance trends.
name: Nightly

permissions:
  contents: read

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: CI tier to run
        default: nightly
        type: choice
        options: [pr, nightly, weekly]
      engines:
        description: Comma-separated engine ids (blank = all registered)
        required: false
      engine_ref:
        description: openswmm.engine ref to build
        default: develop
        required: false

env:
  OMP_NUM_THREADS: 1

jobs:
  sweep:
    name: Sweep (${{ matrix.alias }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, alias: Linux-x64}
          - {os: windows-latest, alias: Windows-x64}
    runs-on: ${{ matrix.os }}
    # A full-corpus sweep can outrun the 6h default, and a
    # cancelled job reads as infrastructure noise rather than a result.
    # Bound it explicitly so overrun is a visible, deliberate limit.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # git-ref engines (swmm-5.2.4) resolve from OPENSWMM_BENCH_CACHE when a
      # cached artifact exists and degrade to UNAVAILABLE otherwise — they are
      # never gating, so a missing cache cannot fail this job.
      - name: Build engines
        uses: ./.github/actions/build-engine
        with:
          ref: ${{ inputs.engine_ref || 'develop' }}

      - name: Run suites
        id: sweep
        run: |
          python run_regression.py --suite all \
            --tier ${{ inputs.tier || 'nightly' }} \
            --summary "$GITHUB_STEP_SUMMARY" \
            --badges badges/
        shell: bash
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.alias }}
          path: |
            results/
            badges/
          retention-days: 30

      # continue-on-error above exists ONLY so the artifacts upload and the
      # dashboard publishes when a sweep fails. Without this step the job then
      # concludes SUCCESS, so the workflow badge is green while the parity gate
      # is failing — a regression platform whose gate does not gate.
      - name: Gate on the sweep result
        if: steps.sweep.outcome == 'failure'
        run: |
          echo "::error::the sweep reported failures; see the job summary and the published dashboard"
          exit 1

  publish:
    name: Publish dashboard
    needs: sweep
    # always(): a sweep that failed is exactly when the dashboard must be
    # refreshed. Skipping publish leaves the PREVIOUS run's page standing, so a
    # broken nightly is indistinguishable from a healthy one (see F20).
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      pages: write
      id-token: write

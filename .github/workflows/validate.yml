# PR validation: schema-check submissions and prove they actually run.
# Fast by design — this gates every contribution, including from people who
# have never built the engine.
name: Validate

permissions:
  contents: read

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

env:
  OMP_NUM_THREADS: 1

jobs:
  harness:
    name: Harness tests
    # No engine required: .out fixtures are synthesized and .rpt fixtures are
    # inline text, so this job gates every PR including corpus-only ones.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest

  schema:
    name: Schema and corpus validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # --changed needs history to diff against dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate changed cases
        run: python -m harness.validate --changed
      - name: Harness self-check
        run: |
          python run_regression.py --list
          python -m harness.engines || true      # reports UNAVAILABLE, never fails
          python -m harness.corpus --census

  smoke:
    name: Run submitted models
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write       # the results comment
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # changed-case detection diffs against the base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: List changed cases
        id: changed
        run: python tools/changed_cases.py --github-output

      - name: Build engines
        if: steps.changed.outputs.cases != ''
        uses: ./.github/actions/build-engine

      - name: Run changed cases
        if: steps.changed.outputs.cases != ''
        run: |
          python -m suites.parity.suite --tier nightly \
            --only "${{ steps.changed.outputs.cases }}" \
            --keep-out none | tee smoke.log
        continue-on-error: true

      - name: Build the PR comment
        if: always() && steps.changed.outputs.cases != ''
        run: |
          {
            echo "### Model smoke run"
            echo
            echo "Ran ${{ steps.changed.outputs.count }} changed case(s) through"
            echo "\`openswmm-v6\` and \`swmm-5.3.0\`."
            if [ "${{ steps.changed.outputs.truncated }}" = "true" ]; then
              echo
              echo "> Only the first 40 changed cases ran here; the nightly sweep covers the rest."
            fi
            echo
            python tools/triage_sweep.py results/parity/scores_nightly.json --markdown
          } > smoke_comment.md
        continue-on-error: true

      - name: Comment results on the PR
        if: github.event_name == 'pull_request' && steps.changed.outputs.cases != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('smoke_comment.md')
              ? fs.readFileSync('smoke_comment.md', 'utf8')
              : 'Smoke run produced no summary.';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - uses: actions/upload-artifact@v4
        if: always() && steps.changed.outputs.cases != ''
        with:
          name: smoke-results
          path: |
            results/
            smoke.log
          retention-days: 14

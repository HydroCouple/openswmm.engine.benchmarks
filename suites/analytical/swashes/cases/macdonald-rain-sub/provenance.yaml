id: macdonald-rain-sub
title: "MacDonald 1000 m channel, subcritical with rain"
verification_class: analytical
source:
  citation: "Delestre et al. (2013), SWASHES: a compilation of shallow water analytic solutions..., IJNMF"
  doi: 10.1002/fld.3741
  section: "SWASHES 3.3.1"
reference:
  file: reference.csv
  columns: [t_s, x_m, h_m, q_m2_per_s]
  generator: "python run_swashes.py gen-refs --cases macdonald-rain-sub"
  independent_implementation: true   # no CeCILL-V2 SWASHES-tool output vendored
parameters:
  L_m: 1000.0
  W1d_m: 500.0
  W2d_m: 10.0
  n_manning: 0.033
  nx: 1000
  dt_routing_s: 0.04
  report_step_s: 60.0
  t_end_s: 6000.0
  compare_times_s: [6000.0]
  upstream: inflow_q (q=1.0 m2/s)
  downstream: stage (eta=0.7483235583183894 m)
  interior_mask: [0.0, 1.0]
  opts_1d: {'INERTIAL_DAMPING': 'PARTIAL'}
cells:
  1d-dynwave:
    mode: analytic
    tol: {'l1_h': 0.035}
    note: "rain R0 = 1 mm/s as per-node lateral inflows R0·dx·W; depth profile is eq. (12) with q(x) = 1 + 0.001x. Gate 3.5%: DW sits at 3.01% — the same scheme error as macdonald-long-sub's 3% plus the half-cell end-weight rain discretization"
  1d-dynwave-legacy:
    mode: analytic
    tol: {'l1_h': 0.035}
  1d-fv:
    mode: analytic
    tol: {'l1_h': 0.03}
    note: "ENGINE FINDING (deliberate red, 2026-08-12): FV runs 18.9% deep with q(x) EXACT and the profile smooth — same signature at rain-sup (25%). DW on the identical deck is at 3%, so the deck is sound: the FV algebraic junction mishandles lateral inflow momentum (all 200 junctions carry inflows here). Left red pending an engine fix"
  1d-dynwave-semi:
    mode: analytic
    tol: {'l1_h': 0.035}
    note: "policy mirrored from 1d-dynwave"

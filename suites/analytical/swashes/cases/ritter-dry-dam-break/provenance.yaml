id: ritter-dry-dam-break
title: "Ritter dam break on a dry domain"
verification_class: analytical
source:
  citation: "Delestre et al. (2013), SWASHES: a compilation of shallow water analytic solutions..., IJNMF"
  doi: 10.1002/fld.3741
  section: "SWASHES 4.1.2"
reference:
  file: reference.csv
  columns: [t_s, x_m, h_m, q_m2_per_s]
  generator: "python run_swashes.py gen-refs --cases ritter-dry-dam-break"
  independent_implementation: true   # no CeCILL-V2 SWASHES-tool output vendored
parameters:
  L_m: 10.0
  W1d_m: 1.0
  W2d_m: 1.0
  n_manning: 0.0
  nx: 200
  dt_routing_s: 0.01
  report_step_s: 1.0
  t_end_s: 6.0
  compare_times_s: [2.0, 4.0, 6.0]
  upstream: wall
  downstream: wall
  interior_mask: [0.0, 1.0]
  opts_2d: {'DRY_DEPTH': '0.0001', 'H_MOVE': '0.0001'}
cells:
  1d-dynwave:
    mode: baseline
    tol: {'l1_h': 0.05, 'front_err_dx': 3.0}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "corpus precedent: implicit DW cannot resolve the dry-bed rarefaction (dw-ritter-drybed-strip); front lags analytic (~27 dx), mass clean — bit-identical to legacy since the MINIMUM_STEP floor fix"
  1d-dynwave-legacy:
    mode: baseline
    tol: {'l1_h': 0.05, 'front_err_dx': 3.0}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "front lags analytic by ~27 dx (corpus precedent); mass clean"
  1d-fv:
    mode: analytic
    tol: {'l1_h': 0.05, 'front_err_dx': 3.0}
  2d-explicit:
    mode: baseline
    tol: {'l1_h': 0.05, 'front_err_dx': 3.0}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "wet/dry front under local inertia; same two-part error as stoker (undamped sawtooth at n=0 plus a missing convective flux), and the front lags because the scheme carries no advection to drive it"
  2d-explicit-adv:
    mode: baseline
    tol: {'l1_h': 0.05, 'front_err_dx': 3.0}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "wet/dry front under local inertia; same two-part error as stoker (undamped sawtooth at n=0 plus a missing convective flux), and the front lags because the scheme carries no advection to drive it"
  1d-dynwave-semi:
    mode: baseline
    tol: {'l1_h': 0.05, 'front_err_dx': 3.0}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "policy mirrored from 1d-dynwave"

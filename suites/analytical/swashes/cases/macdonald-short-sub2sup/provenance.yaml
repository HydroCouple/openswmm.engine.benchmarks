id: macdonald-short-sub2sup
title: "MacDonald 100 m channel, transonic at x = 50 m"
verification_class: analytical
source:
  citation: "Delestre et al. (2013), SWASHES: a compilation of shallow water analytic solutions..., IJNMF"
  doi: 10.1002/fld.3741
  section: "SWASHES 3.2.2 (sub-to-supercritical)"
reference:
  file: reference.csv
  columns: [t_s, x_m, h_m, q_m2_per_s]
  generator: "python run_swashes.py gen-refs --cases macdonald-short-sub2sup"
  independent_implementation: true   # no CeCILL-V2 SWASHES-tool output vendored
parameters:
  L_m: 100.0
  W1d_m: 500.0
  W2d_m: 5.0
  n_manning: 0.0328
  nx: 200
  dt_routing_s: 0.02
  report_step_s: 10.0
  t_end_s: 1800.0
  compare_times_s: [1800.0]
  upstream: inflow_q (q=2.0 m2/s)
  downstream: free
  interior_mask: [0.0, 1.0]
  opts_1d: {'INERTIAL_DAMPING': 'PARTIAL'}
  opts_2d: {'FROUDE_MAX': '3'}
cells:
  1d-dynwave:
    mode: baseline
    tol: {'l1_h': 0.04}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "transcritical choke precedent (bump-transcritical): 6.0% smooth with the recorded PARTIAL deviation (8.7% + sawtooth under NONE)"
  1d-dynwave-legacy:
    mode: baseline
    tol: {'l1_h': 0.04}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
  1d-fv:
    mode: analytic
    tol: {'l1_h': 0.04}
  2d-explicit:
    mode: baseline
    tol: {'l1_h': 0.04}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "supercritical downstream half — no-advection limit"
  2d-explicit-adv:
    mode: xfail
    tol: {'l1_h': 0.04}
    note: "never steadies with ADVECTION on (drift 0.10): roll-wave-like cycle on the supercritical downstream half (Vedernikov-stable, so numerical — the upwinded convective term sustains it where the advection-less scheme damps it)"
  1d-dynwave-semi:
    mode: baseline
    tol: {'l1_h': 0.04}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "policy mirrored from 1d-dynwave"

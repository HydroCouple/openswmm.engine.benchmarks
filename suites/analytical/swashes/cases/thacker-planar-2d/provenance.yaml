id: thacker-planar-2d
title: "Thacker planar surface in a paraboloid"
verification_class: analytical
source:
  citation: "Delestre et al. (2013), SWASHES: a compilation of shallow water analytic solutions..., IJNMF"
  doi: 10.1002/fld.3741
  section: "SWASHES 4.2.2 (planar)"
reference:
  file: reference.csv
  columns: [t_s, x_m, h_m, q_m2_per_s]
  generator: "python run_swashes.py gen-refs --cases thacker-planar-2d"
  independent_implementation: true   # no CeCILL-V2 SWASHES-tool output vendored
parameters:
  L_m: 4.0
  W1d_m: 1.0
  W2d_m: 4.0
  n_manning: 0.0
  nx: 80
  dt_routing_s: 0.0
  report_step_s: 0.25
  t_end_s: 13.45710439639912
  compare_times_s: [2.0, 4.0]
  upstream: wall
  downstream: wall
  interior_mask: [0.0, 1.0]
  opts_2d: {'DRY_DEPTH': '0.0001', 'H_MOVE': '0.0001'}
cells:
  2d-explicit:
    mode: baseline
    tol: {'l1_h': 0.05}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "v(t=0)=eta*omega seeded via [2D_INITIAL_VELOCITY] (engine edge-flux seeding, 2026-08-03); remaining error is local-inertia phase/front drift — XPASS flips analytic"
  2d-explicit-adv:
    mode: baseline
    tol: {'l1_h': 0.05}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "v(t=0)=eta*omega seeded via [2D_INITIAL_VELOCITY] (engine edge-flux seeding, 2026-08-03); remaining error is local-inertia phase/front drift — XPASS flips analytic"

id: bend90-gentle
title: "90-degree miter bend, gentle flow (Fr 0.30)"
verification_class: cross-solver-2d (local-inertial reference — lower-bound bend loss)
reference:
  file: reference_2d.csv
  columns: [t_s, x_m, h_m, q_m2_per_s]   # x = centerline arc length s
  generator: "python run_swashes.py gen-2d-ref --cases bend90-gentle --pin"
  engine_sha: 5a693493
  inp_sha: 4d0d5c9105eb7580
  cfl_number: 0.3
  steady_resid: 0.00446511
  mass_pct: 3.375734088090804e-12
  planform: theta=90 deg, s_bend=60 m, W=4 m
parameters:
  L_m: 120.0
  W1d_m: 4.0
  W2d_m: 4.0
  n_manning: 0.025
  nx: 240
  dt_routing_s: 0.05
  report_step_s: 10.0
  t_end_s: 3600.0
  compare_times_s: [3600.0]
  upstream: inflow_q (q=0.9396275858019495 m2/s)
  downstream: stage (eta=1.0 m)
  interior_mask: [0.0, 1.0]
cells:
  1d-dynwave:
    mode: analytic
    tol: {'l1_h': 0.1, 'linf_h': 0.15, 'mass_pct': 1.0}
    note: "graded against the pinned 2D bent-geometry reference (local-inertial — lower-bound bend loss)"
  1d-dynwave-legacy:
    mode: analytic
    tol: {'l1_h': 0.1, 'linf_h': 0.15, 'mass_pct': 1.0}
    note: "graded against the pinned 2D bent-geometry reference (local-inertial — lower-bound bend loss)"
  1d-dynwave-vj:
    mode: analytic
    tol: {'l1_h': 0.1, 'linf_h': 0.15, 'mass_pct': 1.0}
    note: "graded against the pinned 2D bent-geometry reference (local-inertial — lower-bound bend loss)"
  1d-fv:
    mode: analytic
    tol: {'l1_h': 0.1, 'linf_h': 0.15, 'mass_pct': 1.0}

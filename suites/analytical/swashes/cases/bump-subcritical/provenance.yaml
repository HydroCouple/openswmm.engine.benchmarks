id: bump-subcritical
title: "Subcritical flow over a bump"
verification_class: analytical
source:
  citation: "Delestre et al. (2013), SWASHES: a compilation of shallow water analytic solutions..., IJNMF"
  doi: 10.1002/fld.3741
  section: "SWASHES 3.1.3"
reference:
  file: reference.csv
  columns: [t_s, x_m, h_m, q_m2_per_s]
  generator: "python run_swashes.py gen-refs --cases bump-subcritical"
  independent_implementation: true   # no CeCILL-V2 SWASHES-tool output vendored
parameters:
  L_m: 25.0
  W1d_m: 1.0
  W2d_m: 2.0
  n_manning: 0.0
  nx: 25
  dt_routing_s: 0.05
  report_step_s: 10.0
  t_end_s: 1800.0
  compare_times_s: [1800.0]
  upstream: inflow_q (q=4.42 m2/s)
  downstream: stage (eta=2.0 m)
  interior_mask: [0.0, 1.0]
cells:
  1d-dynwave:
    mode: analytic
    tol: {'l1_h': 0.02}
  1d-dynwave-legacy:
    mode: analytic
    tol: {'l1_h': 0.02}
  1d-dynwave-vj:
    mode: analytic
    tol: {'l1_h': 0.02}
    note: "zero-storage VJ chain matches the junction chain (l1 0.17%); at small fairness-scaled dt the VJ chain keeps fine grids stable where junction chains seiche (dx=0.2/dt=0.01: VJ 0.24% vs junctions 21%) — at the case dt both refine cleanly (VJ_FINDINGS.md); interior ICs not representable, dry-start spin-up"
  1d-fv:
    mode: analytic
    tol: {'l1_h': 0.02}
  2d-explicit:
    mode: analytic
    tol: {'l1_h': 0.03}
    note: "PASSES since the inertial stage/inflow BC fix (2026-08-03): the old 4.4% was a boundary-condition stage offset (collapsed-Manning Dirichlet cell + momentum-less inflow), NOT the Bernoulli dip; the residual ~0.7% is the genuine no-advection limit (steady, mass-exact). EXPECTED in the figure: eta is dead FLAT over the crest (+7.7 cm depth residual at x=8-12 m) — flat eta is the EXACT frictionless steady state of the local-inertial equation (no q^2/h term; the dip = Delta(v^2/2g) it cannot represent). OWNER RULING 2026-08-04: keep local-inertial, document; momentum-advection upgrade declined for now"
  2d-explicit-adv:
    mode: analytic
    tol: {'l1_h': 0.03}
    note: "PASSES since the inertial stage/inflow BC fix (2026-08-03): the old 4.4% was a boundary-condition stage offset (collapsed-Manning Dirichlet cell + momentum-less inflow), NOT the Bernoulli dip; the residual ~0.7% is the genuine no-advection limit (steady, mass-exact). EXPECTED in the figure: eta is dead FLAT over the crest (+7.7 cm depth residual at x=8-12 m) — flat eta is the EXACT frictionless steady state of the local-inertial equation (no q^2/h term; the dip = Delta(v^2/2g) it cannot represent). OWNER RULING 2026-08-04: keep local-inertial, document; momentum-advection upgrade declined for now"
  1d-dynwave-semi:
    mode: analytic
    tol: {'l1_h': 0.02}
    note: "policy mirrored from 1d-dynwave"

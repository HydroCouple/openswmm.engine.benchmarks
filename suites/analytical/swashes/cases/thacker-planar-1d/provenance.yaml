id: thacker-planar-1d
title: "Thacker planar surface in a parabola"
verification_class: analytical
source:
  citation: "Delestre et al. (2013), SWASHES: a compilation of shallow water analytic solutions..., IJNMF"
  doi: 10.1002/fld.3741
  section: "SWASHES 4.2.1"
reference:
  file: reference.csv
  columns: [t_s, x_m, h_m, q_m2_per_s]
  generator: "python run_swashes.py gen-refs --cases thacker-planar-1d"
  independent_implementation: true   # no CeCILL-V2 SWASHES-tool output vendored
parameters:
  L_m: 4.0
  W1d_m: 1.0
  W2d_m: 0.5
  n_manning: 0.0
  nx: 200
  dt_routing_s: 0.004
  report_step_s: 1.0
  t_end_s: 10.0
  compare_times_s: [2.0, 4.0, 10.0]
  upstream: wall
  downstream: wall
  interior_mask: [0.0, 1.0]
  opts_2d: {'DRY_DEPTH': '0.0001', 'H_MOVE': '0.0001'}
cells:
  1d-dynwave:
    mode: baseline
    tol: {'l1_h': 0.05, 'mass_pct': 15.0}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "NOT gradual wet/dry mass loss: a t=0 blow-up. 200 of 202 nodes flood at 0 00:00 at 36-48 CMS in a basin holding ~1 m3; depths pin at MaxDepth and the excess is discarded (ALLOW_PONDING NO), so Flooding Loss is 177x the Initial Stored Volume and the -27912% is that over a near-zero denominator. The ICs are correct (planar eta, dry bank above the waterline). Prime suspect is conditioning: MIN_SURFAREA floors the DENOMINATOR of the node head update (DynamicWave.cpp:3210/3325), and this deck sets 0.01 m2 against the 1.167 m2 default - 117x smaller - at ROUTING_STEP 0.004. Oscillation heavily damped vs analytic; bit-identical to legacy since the MINIMUM_STEP floor fix"
  1d-dynwave-legacy:
    mode: baseline
    tol: {'l1_h': 0.05, 'mass_pct': 15.0}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "same t=0 blow-up as 1d-dynwave (see that row): whole-network flooding at 0 00:00, 98x the Initial Stored Volume discarded, suspect the 0.01 m2 MIN_SURFAREA denominator; oscillation heavily damped vs analytic"
  1d-fv:
    mode: analytic
    tol: {'l1_h': 0.05}
  2d-explicit:
    mode: baseline
    tol: {'l1_h': 0.05}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "u(x,0)=0 — depth-only IC is exact at t=0"
  2d-explicit-adv:
    mode: baseline
    tol: {'l1_h': 0.05}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "u(x,0)=0 — depth-only IC is exact at t=0"
  1d-dynwave-semi:
    mode: baseline
    tol: {'l1_h': 0.05, 'mass_pct': 15.0}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "policy mirrored from 1d-dynwave"

id: thacker-radial-2d
title: "Thacker radially-symmetric paraboloid oscillation"
verification_class: analytical
source:
  citation: "Delestre et al. (2013), SWASHES: a compilation of shallow water analytic solutions..., IJNMF"
  doi: 10.1002/fld.3741
  section: "SWASHES 4.2.2 (radial)"
reference:
  file: reference.csv
  columns: [t_s, x_m, h_m, q_m2_per_s]
  generator: "python run_swashes.py gen-refs --cases thacker-radial-2d"
  independent_implementation: true   # no CeCILL-V2 SWASHES-tool output vendored
parameters:
  L_m: 4.0
  W1d_m: 1.0
  W2d_m: 4.0
  n_manning: 0.0
  nx: 80
  dt_routing_s: 0.0
  report_step_s: 0.25
  t_end_s: 6.72855219819956
  compare_times_s: [2.0, 4.0, 6.0]
  upstream: wall
  downstream: wall
  interior_mask: [0.0, 1.0]
  opts_2d: {'DRY_DEPTH': '0.0001', 'H_MOVE': '0.0001'}
cells:
  2d-explicit:
    mode: baseline
    tol: {'l1_h': 0.05}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "u=v=0 at t=0 (depth-only IC exact); phase/amplitude drift expected of local inertia — XPASS flips analytic"
  2d-explicit-adv:
    mode: baseline
    tol: {'l1_h': 0.05}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "u=v=0 at t=0 (depth-only IC exact); phase/amplitude drift expected of local inertia — XPASS flips analytic"

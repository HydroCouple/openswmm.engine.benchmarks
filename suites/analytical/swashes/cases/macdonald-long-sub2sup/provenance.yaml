id: macdonald-long-sub2sup
title: "MacDonald 1000 m channel, subcritical to supercritical"
verification_class: analytical
source:
  citation: "Delestre et al. (2013), SWASHES: a compilation of shallow water analytic solutions..., IJNMF"
  doi: 10.1002/fld.3741
  section: "SWASHES 3.2.1 (sub-to-supercritical)"
reference:
  file: reference.csv
  columns: [t_s, x_m, h_m, q_m2_per_s]
  generator: "python run_swashes.py gen-refs --cases macdonald-long-sub2sup"
  independent_implementation: true   # no CeCILL-V2 SWASHES-tool output vendored
parameters:
  L_m: 1000.0
  W1d_m: 500.0
  W2d_m: 10.0
  n_manning: 0.0218
  nx: 1000
  dt_routing_s: 0.04
  report_step_s: 60.0
  t_end_s: 6000.0
  compare_times_s: [6000.0]
  upstream: inflow_q (q=2.0 m2/s)
  downstream: free
  interior_mask: [0.0, 1.0]
  opts_1d: {'INERTIAL_DAMPING': 'PARTIAL'}
  opts_2d: {'FROUDE_MAX': '3'}
cells:
  1d-dynwave:
    mode: analytic
    tol: {'l1_h': 0.04}
    note: "MEETS analytic through the smooth transonic point (unlike the frictionless bump-transcritical choke). Recorded deviation: INERTIAL_DAMPING PARTIAL — under the normalized NONE the VJ column carries a stationary odd-even sawtooth (l1 4.5% -> 0.9% with PARTIAL; q exact either way)"
  1d-dynwave-legacy:
    mode: analytic
    tol: {'l1_h': 0.04}
  1d-dynwave-vj:
    mode: analytic
    tol: {'l1_h': 0.04}
    note: "0.9% with PARTIAL damping; sawtoothed at 4.5% under NONE (checkerboard mode of the undamped chain)"
  1d-fv:
    mode: analytic
    tol: {'l1_h': 0.04}
  2d-explicit:
    mode: baseline
    tol: {'l1_h': 0.04}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "downstream half is supercritical — the macdonald-long-sup no-advection limit. The retired THETA 0.7/0.5 columns met the analytic gate here purely by adding q-centred smoothing over the residual sawtooth; the 0.8 default does not. That is a damping-tuning artefact, not a physics fix — the advection column is the term this case is actually missing"
  2d-explicit-adv:
    mode: xfail
    tol: {'l1_h': 0.04}
    note: "never steadies with ADVECTION on (drift 0.34): the upwinded convective term sustains roll-waves on the supercritical downstream half (macdonald-long-sup mechanism) and first-order diffusion costs l1 6.7%"
  1d-dynwave-semi:
    mode: analytic
    tol: {'l1_h': 0.04}
    note: "policy mirrored from 1d-dynwave"

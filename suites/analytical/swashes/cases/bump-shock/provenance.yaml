id: bump-shock
title: "Transcritical flow with shock"
verification_class: analytical
source:
  citation: "Delestre et al. (2013), SWASHES: a compilation of shallow water analytic solutions..., IJNMF"
  doi: 10.1002/fld.3741
  section: "SWASHES 3.1.5"
reference:
  file: reference.csv
  columns: [t_s, x_m, h_m, q_m2_per_s]
  generator: "python run_swashes.py gen-refs --cases bump-shock"
  independent_implementation: true   # no CeCILL-V2 SWASHES-tool output vendored
parameters:
  L_m: 25.0
  W1d_m: 1.0
  W2d_m: 2.0
  n_manning: 0.0
  nx: 25
  dt_routing_s: 0.05
  report_step_s: 10.0
  t_end_s: 1800.0
  compare_times_s: [1800.0]
  upstream: inflow_q (q=0.18 m2/s)
  downstream: stage (eta=0.33 m)
  interior_mask: [0.0, 1.0]
  x_shock_m: 11.665618
cells:
  1d-dynwave:
    mode: baseline
    tol: {'l1_h': 0.08, 'shock_err_m': 3.0, 'mass_pct': 3.0}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "transcritical choke + slow shock slosh — implicit DW holds no steady shock position (mean drifts ~20%); analytic tols recorded for FV; mass gate 3% (storage:throughput inflation at q=0.18)"
  1d-dynwave-legacy:
    mode: baseline
    tol: {'l1_h': 0.08, 'shock_err_m': 3.0, 'mass_pct': 3.0}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "same shock-slosh limitation as 1d-dynwave"
  1d-dynwave-vj:
    mode: baseline
    tol: {'l1_h': 0.08, 'shock_err_m': 3.0, 'mass_pct': 3.0}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "same shock-slosh limitation as the junction chain (l1 5.0% vs 4.1%) — VJ at parity"
  1d-fv:
    mode: analytic
    tol: {'l1_h': 0.05, 'shock_err_m': 3.0, 'mass_pct': 3.0}
  2d-explicit:
    mode: baseline
    tol: {'l1_h': 0.05, 'shock_err_m': 3.0}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "local-inertial through a hydraulic jump"
  2d-explicit-adv:
    mode: baseline
    tol: {'l1_h': 0.05, 'shock_err_m': 3.0}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "local-inertial through a hydraulic jump"
  1d-dynwave-semi:
    mode: baseline
    tol: {'l1_h': 0.08, 'shock_err_m': 3.0, 'mass_pct': 3.0}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "policy mirrored from 1d-dynwave"

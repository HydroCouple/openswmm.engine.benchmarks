id: macdonald-short-shock
title: "MacDonald 100 m channel, transonic then shock at x = 66.7 m"
verification_class: analytical
source:
  citation: "Delestre et al. (2013), SWASHES: a compilation of shallow water analytic solutions..., IJNMF"
  doi: 10.1002/fld.3741
  section: "SWASHES 3.2.2 (smooth transition and shock)"
reference:
  file: reference.csv
  columns: [t_s, x_m, h_m, q_m2_per_s]
  generator: "python run_swashes.py gen-refs --cases macdonald-short-shock"
  independent_implementation: true   # no CeCILL-V2 SWASHES-tool output vendored
parameters:
  L_m: 100.0
  W1d_m: 500.0
  W2d_m: 5.0
  n_manning: 0.0328
  nx: 200
  dt_routing_s: 0.02
  report_step_s: 10.0
  t_end_s: 1800.0
  compare_times_s: [1800.0]
  upstream: inflow_q (q=2.0 m2/s)
  downstream: stage (eta=2.878707967283852 m)
  interior_mask: [0.0, 1.0]
  x_shock_m: 66.666667
  opts_1d: {'INERTIAL_DAMPING': 'PARTIAL'}
cells:
  1d-dynwave:
    mode: baseline
    tol: {'l1_h': 0.05, 'shock_err_m': 5.0}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "steady smooth 5.7% with PARTIAL (shock 0.58 m); the damping smears the transonic drawdown past the 5% gate — implicit-DW limit, analytic tols recorded for promotion"
  1d-dynwave-legacy:
    mode: baseline
    tol: {'l1_h': 0.05, 'shock_err_m': 5.0}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
  1d-fv:
    mode: analytic
    tol: {'l1_h': 0.05, 'shock_err_m': 5.0}
    note: "l1 0.38%, shock 0.08 m at dx=0.5"
  2d-explicit:
    mode: baseline
    tol: {'l1_h': 0.05, 'shock_err_m': 5.0}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "local-inertial through a hydraulic jump"
  2d-explicit-adv:
    mode: xfail
    tol: {'l1_h': 0.05, 'shock_err_m': 5.0}
    note: "never steadies with ADVECTION on (drift 0.057): advective limit-cycle at the jump — the plain column is steady at the same resolution"
  1d-dynwave-semi:
    mode: baseline
    tol: {'l1_h': 0.05, 'shock_err_m': 5.0}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "policy mirrored from 1d-dynwave"

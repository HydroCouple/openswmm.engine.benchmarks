id: macdonald-short-sup
title: "MacDonald 100 m channel, supercritical throughout"
verification_class: analytical
source:
  citation: "Delestre et al. (2013), SWASHES: a compilation of shallow water analytic solutions..., IJNMF"
  doi: 10.1002/fld.3741
  section: "SWASHES 3.2.2 (supercritical)"
reference:
  file: reference.csv
  columns: [t_s, x_m, h_m, q_m2_per_s]
  generator: "python run_swashes.py gen-refs --cases macdonald-short-sup"
  independent_implementation: true   # no CeCILL-V2 SWASHES-tool output vendored
parameters:
  L_m: 100.0
  W1d_m: 500.0
  W2d_m: 5.0
  n_manning: 0.03
  nx: 200
  dt_routing_s: 0.02
  report_step_s: 10.0
  t_end_s: 1800.0
  compare_times_s: [1800.0]
  upstream: inflow_q (q=2.0 m2/s)
  downstream: free
  interior_mask: [0.05, 1.0]
  opts_1d: {'INERTIAL_DAMPING': 'PARTIAL'}
  opts_2d: {'FROUDE_MAX': '3'}
cells:
  1d-dynwave:
    mode: baseline
    tol: {'l1_h': 0.04}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "smooth +6% bias with the recorded PARTIAL deviation (under NONE a 0.18 m stationary sawtooth pushes l1 to 16.5% with q EXACT — the undamped checkerboard at dx = 1 m); residual: shallow upstream, deep downstream — the damped scheme under-tracks the 25 m-scale bed variation the long channel (dx = 5) never sees"
  1d-dynwave-legacy:
    mode: baseline
    tol: {'l1_h': 0.04}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
  1d-dynwave-vj:
    mode: baseline
    tol: {'l1_h': 0.04}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
  1d-fv:
    mode: analytic
    tol: {'l1_h': 0.04}
  2d-explicit:
    mode: xfail
    tol: {'l1_h': 0.04}
    note: "fully supercritical — macdonald-long-sup precedent: local inertia never steadies without the convective term"
  2d-explicit-adv:
    mode: xfail
    tol: {'l1_h': 0.04}
    note: "l1 41% at CFL 0.5 (drifting); NOT a CFL-margin issue — the CFL 0.25 probe BLEW UP (l1 3.90, drift 2.5; runs/_advprobe): the theta q-centred blend damps per-STEP, so halving dt halves the dissipation per unit time and the advective cycle grows. The supercritical-reach instability needs scheme work (dt-scaled damping or a dissipative advective flux), not a tighter Courant number"
  1d-dynwave-semi:
    mode: baseline
    tol: {'l1_h': 0.04}
    baseline_tol: {'l1_h': 0.005, 'linf_h': 0.01}
    note: "policy mirrored from 1d-dynwave"
